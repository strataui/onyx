[workspace]
resolver = "2"
members = [
    "crates/strata_web_reader",
    "crates/onyx_reader",
    "crates/onyx_browser",
    "examples/strata_browser",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Strata Contributors"]
license = "MIT"
repository = "https://github.com/strataui/onyx"
homepage = "https://github.com/strataui/onyx"
documentation = "https://docs.rs/strata-web-reader"
keywords = ["browser", "html", "reader", "web", "strata"]
categories = ["web-programming", "gui"]

[workspace.dependencies]
strata-web-reader = { path = "crates/strata_web_reader", version = "0.1.1" }
onyx-reader = { path = "crates/onyx_reader", version = "0.1.0" }

strata-ui = "0.1.5"
strata-primitives = "0.1.0"
strata-dom = "0.1.3"
strata-macro = "0.1.3"
strata-style = "0.1.1"
strata-layout = "0.1.1"
strata-render = "0.1.3"
strata-ui-platform = "0.1.3"
strata-storage = "0.1.0"
strata-web-api = "0.1.1"
strata-devtools = "0.1.1"
strata-js = "0.1.1"
strata-components = "0.1.3"
strata-icons = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.dev]
opt-level = 1
