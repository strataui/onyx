[package]
name = "onyx-browser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Zero-Chromium Web Browser built directly on Strata and Mica"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/onyx-browser"
keywords.workspace = true
categories.workspace = true

[lib]
name = "strata_browser"
path = "src/lib.rs"

[[bin]]
name = "onyx"
path = "src/main.rs"

[dependencies]
strata-ui = { workspace = true }
strata-dom = { workspace = true }
strata-macro = { workspace = true }
strata-components = { workspace = true }
strata-icons = { workspace = true }
strata-ui-platform = { workspace = true }
strata-devtools = { workspace = true }
strata-web-reader = { workspace = true }
strata-style = { workspace = true }
strata-render = { workspace = true }
strata-layout = { workspace = true }
strata-web-api = { workspace = true }
strata-js = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
