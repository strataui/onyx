[package]
name = "strata_browser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Zero-Chromium Web Browser built directly on Strata and Mica"
repository.workspace = true

[lib]
name = "strata_browser"
path = "src/lib.rs"

[[bin]]
name = "onyx"
path = "src/main.rs"

[dependencies]
strata = { workspace = true }
strata_dom = { workspace = true }
strata_macro = { workspace = true }
strata_ui = { workspace = true }
strata_icons = { workspace = true }
strata_platform = { workspace = true }
strata_devtools = { workspace = true }
strata_web_reader = { workspace = true }
strata_style = { workspace = true }
strata_render = { workspace = true }
strata_layout = { workspace = true }
strata_web_api = { workspace = true }
strata_js = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
